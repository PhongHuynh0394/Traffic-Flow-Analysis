  notebook:
    container_name: notebook
    build:
      context: ./notebook
    image: traffic-notebook:latest
    volumes:
      - ${PWD}/notebook/workplace:/home/jovyan/workplace
    ports:
      - 8888:8888
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-pass}
    # command: start-notebook.sh
    user: root
    env_file:
      - .env
    networks:
      - docker-net


  kafka-broker-1:
    image: bitnami/kafka:latest
    container_name: kafka-broker-1
    environment:
      # KRaft setting
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_KRAFT_CLUSTER_ID=clusterkafka
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      # - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka-broker-1:9093,1@kafka-broker-2:9093
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka-broker-1:9093
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true # auto create topic
      # Listener
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=INTERNAL://:9094,CONTROLLER://:9093,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka-broker-1:9094,EXTERNAL://kafka-broker-1:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      # Clustering
      # - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      # - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      # - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
    ports: 
      - 9092:9092
      # - 9094:9094
    volumes:
      - kafka_data1:/bitnami/kafka
    networks:
      - docker-net
    healthcheck:
      test: nc -z localhost 9092 || exit -1
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 10


  kafka-ui:
      image: provectuslabs/kafka-ui
      container_name: kafka-ui
      networks:
        - docker-net
      depends_on: 
        - kafka-broker-1
      ports:
        - "7777:8080"
      restart: always
      environment:
        - KAFKA_CLUSTERS_0_NAME=LocalKafka
        - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-broker-1:9094
        # - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181

